name: daily-news
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-news
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch today's sentences
        run: python scripts/fetch_daily.py
      - name: Commit news/daily.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain news/daily.json)" ]; then
            git add news/daily.json
            git commit -m "chore(news): daily $(date -u +%F)"
            git push
          else
            echo "no change"
          fi
